{% extends "base.html" %}
{% block title %}Редагувати автомобіль{% endblock %}

{% block content %}
<h2>Редагувати інформацію про авто</h2>
<div class="form-container">
    <form action="{{ url_for('edit_car', id=car.id) }}" method="POST">
        <input type="text" name="brand" value="{{ car.brand }}" placeholder="Марка" required>
        <input type="text" name="model" value="{{ car.model }}" placeholder="Модель" required>
        <input type="number" name="year" value="{{ car.year }}" placeholder="Рік випуску">
        <input type="text" name="image_url" value="{{ car.image_url }}" placeholder="URL зображення">
        <textarea name="description" placeholder="Опис..." rows="4">{{ car.description }}</textarea>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn">Зберегти зміни</button>
            <a href="{{ url_for('cars') }}" class="btn" style="background-color: #64748b; text-decoration: none; display: flex; align-items: center;">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
